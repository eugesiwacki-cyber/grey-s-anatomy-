<div id="lightbox" class="lightbox" onclick="cerrarLightbox(event)">
  <span class="cerrar">&times;</span>
  <span class="flecha flecha-izq" onclick="event.stopPropagation(); cambiarImagen(-1)">&#10094;</span>
  <img class="lightbox-img" id="lightbox-img" onclick="event.stopPropagation()">
  <span class="flecha flecha-der" onclick="event.stopPropagation(); cambiarImagen(1)">&#10095;</span>
</div>

<script>
  const imagenes = document.querySelectorAll('.gallery-grid img');
  let indiceActual = 0;

  function abrirLightbox(img) {
    const imgs = Array.from(imagenes);
    indiceActual = imgs.indexOf(img);
    mostrarImagen();
    document.getElementById('lightbox').classList.add('activo');
  }

  function mostrarImagen() {
    document.getElementById('lightbox-img').src = imagenes[indiceActual].src;
  }

  function cambiarImagen(direccion) {
    indiceActual = (indiceActual + direccion + imagenes.length) % imagenes.length;
    mostrarImagen();
  }

  function cerrarLightbox() {
    document.getElementById('lightbox').classList.remove('activo');
  }

  document.addEventListener('keydown', function(e) {
    const lightbox = document.getElementById('lightbox');
    if (!lightbox.classList.contains('activo')) return;
    if (e.key === 'ArrowRight') cambiarImagen(1);
    if (e.key === 'ArrowLeft') cambiarImagen(-1);
    if (e.key === 'Escape') cerrarLightbox();
  });
</script>
